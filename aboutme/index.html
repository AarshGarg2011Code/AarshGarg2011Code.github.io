<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Me — Aarsh Garg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #060e14;
      --card-bg: rgba(12, 23, 34, 0.45);
      --card-border: rgba(6, 182, 212, 0.22);
      --text-main: #f0f9ff;
      --text-muted: #7dd3fc;
      --accent-1: #06b6d4;
      --accent-2: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --glow: rgba(6, 182, 212, 0.22);
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.3);
      border-radius: 4px;
      border: 1px solid rgba(6, 182, 212, 0.1);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-1);
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, transparent 80%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
    }
    .bg-glow-1, .bg-glow-2 {
      position: fixed;
      width: 850px;
      height: 850px;
      border-radius: 50%;
      filter: blur(200px);
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
    }
    .bg-glow-1 {
      background: var(--accent-1);
      top: -300px;
      left: -250px;
    }
    .bg-glow-2 {
      background: var(--accent-2);
      bottom: -250px;
      right: -250px;
      animation-delay: -7s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.2); }
    }
    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
    }
    .glass {
      background: var(--card-bg);
      backdrop-filter: blur(5px) saturate(180%);
      -webkit-backdrop-filter: blur(5px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 
        0 20px 50px -10px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }
    .markdown-card {
      padding: 3rem 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .markdown-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-gradient);
      box-shadow: 0 0 12px var(--accent-1);
    }
    .markdown-body {
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.75;
      font-size: 1rem;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, 
    .markdown-body h4, .markdown-body h5, .markdown-body h6 {
      color: var(--text-main);
      font-weight: 800;
      margin-top: 2.25rem;
      margin-bottom: 1rem;
      letter-spacing: -0.025em;
    }
    .markdown-body h1:first-child {
      margin-top: 0;
    }
    .markdown-body h1 {
      font-size: 2.5rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .markdown-body h2 {
      font-size: 1.4rem;
      color: var(--text-main);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-mono);
    }
    .markdown-body h2::before {
      content: '~/';
      font-family: var(--font-mono);
      color: var(--accent-1);
      font-weight: 700;
      font-size: 1.1rem;
    }
    .markdown-body h3 {
      font-size: 1.15rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-weight: 600;
    }
    .markdown-body p {
      margin-bottom: 1.25rem;
      color: #94a3b8;
    }
    .markdown-body a {
      color: var(--text-main);
      text-decoration: none;
      background: rgba(6, 182, 212, 0.08);
      border: 1px solid rgba(6, 182, 212, 0.25);
      padding: 0.2rem 0.65rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .markdown-body a:hover {
      background: var(--accent-1);
      color: var(--bg);
      border-color: var(--accent-1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--glow);
    }
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: #94a3b8;
    }
    .markdown-body li {
      margin-bottom: 0.5rem;
    }
    .markdown-body li::marker {
      color: var(--accent-1);
    }
    .markdown-body blockquote {
      border-left: 3px solid var(--accent-1);
      padding: 0.85rem 1.25rem;
      margin: 1.5rem 0;
      background: rgba(6, 182, 212, 0.04);
      border-radius: 0 8px 8px 0;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      box-shadow: inset 1px 0 10px rgba(6, 182, 212, 0.05);
    }
    .markdown-body code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: rgba(6, 182, 212, 0.12);
      color: var(--accent-1);
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      border: 1px solid rgba(6, 182, 212, 0.2);
    }
    .markdown-body pre {
      margin: 1.5rem 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #03080d !important;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .markdown-body pre code {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      padding: 1.25rem;
      display: block;
      overflow-x: auto;
      line-height: 1.6;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1.5rem 0;
      font-size: 0.9rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }
    .markdown-body th, .markdown-body td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      text-align: left;
    }
    .markdown-body th:last-child, .markdown-body td:last-child {
      border-right: none;
    }
    .markdown-body tr:last-child td {
      border-bottom: none;
    }
    .markdown-body th {
      background: rgba(6, 182, 212, 0.12);
      color: var(--text-main);
      font-family: var(--font-mono);
      font-weight: 700;
    }
    .markdown-body tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.015);
    }
    .markdown-body tr:hover {
      background: rgba(6, 182, 212, 0.03);
    }
    .markdown-body hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--card-border), transparent);
      margin: 2.25rem 0;
    }
    @media (max-width: 640px) {
      .container {
        padding: 1.5rem 1rem;
      }
      .markdown-card {
        padding: 1.75rem 1.25rem;
      }
      .markdown-body h1 {
        font-size: 2rem;
      }
      .bg-glow-1, .bg-glow-2 {
        width: 500px;
        height: 500px;
      }
    }
    body::after {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 1000px;
      height: 1000px;
      transform: translate(-50%, -50%);
      background-image: url('bgicon.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      filter: brightness(0) invert(1) drop-shadow(0 0 15px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 40px rgba(6, 182, 212, 0.6));
      opacity: 0.15;
      pointer-events: none;
      z-index: -1;
      animation: logoGlowPulse 6s ease-in-out infinite alternate;
    }
    @keyframes logoGlowPulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(255, 255, 255, 0.7)) drop-shadow(0 0 25px rgba(6, 182, 212, 0.4));
        opacity: 0.12;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.04);
        filter: brightness(0) invert(1) drop-shadow(0 0 20px rgba(255, 255, 255, 1)) drop-shadow(0 0 50px rgba(6, 182, 212, 0.8));
        opacity: 0.20;
      }
    }
</style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="container">
    <main class="glass markdown-card">
      <article id="markdown-content" class="markdown-body">
      </article>
    </main>
  </div>
  <script>
    const rawMarkdown = `
# Aarsh Garg

\`Student\` • \`Open Source Developer\`

---

## About Me

Hi there! My name is Aarsh Garg, and I am a student in high school.

### Introduction
I was born in December 2011, and I currently live in Navi Mumbai, Maharashtra, India.
Being in a familly with 2 MCAs, I naturally developed a keen interest in programming and software.
I learnt Python in Grade 7, and now I make projects that involve Python in some or another way.

### Education
I spent half of my Primary Education in various schools in Gurugram, Haryana and Airoli, Navi Mumbai.
As for my Secondary Education, I currently study in [Terna Orchids the International School](https://maps.app.goo.gl/VuWiQgxZJ85r2jDh9) as of 2026.

### Skillset
My primary skill which I am persuing in my career is programming and software development, having already started many projects,
made a lot of GitHub repositories and PyPI Packages, and more.
Apart from programming and development, I also have minor skillsets of:
- **Music**: Singing, Composing, and Directing.
- **Theatre**: I've been in a couple of school acts.
- **Science & Math**: Having passed Mumbai's DHBBVC, I am good in PCM science and will persue it in 11th-12th.
- **Astronomy**: I often get into space-based projects.
- **Mythology**: Hindu Mythology, Upanishads, Vedas and Puranas, I get interested in them.
**For music, I have a profile on Bandlab, where I compose songs. [BandLab](https://www.bandlab.com/aarshgargmusic)**
---

## Get In Touch

Let's build something together! Contact me for collaboration:

- **Email:** [aarshg.13@gmail.com](mailto:aarshg.13@gmail.com)
- **Phone:** [+91 8356949225](tel:+918356949225)
`;
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      gfm: true,
      breaks: true
    });
    document.addEventListener("DOMContentLoaded", () => {
      const targetElement = document.getElementById("markdown-content");
      targetElement.innerHTML = marked.parse(rawMarkdown);
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
